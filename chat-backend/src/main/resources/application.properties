spring.application.name=chat-backend

server.port=8080

spring.data.mongodb.uri=${MONGODB_URI}

# logging.level.org.springframework.data.mongodb=DEBUG

# server.servlet.context-path=/api/v1

management.endpoints.web.exposure.include=*

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

cloudflare.r2.endpoint=${CLOUDFLARE_ENDPOINT}
cloudflare.r2.access-key=${CLOUDFLARE_ACCESSKEY}
cloudflare.r2.secret-key=${CLOUDFLARE_SECRETKEY}
r2.bucket.name=${CLOUDFLARE_BUCKET_NAME}
r2.public.url=${CLOUDFLARE_PUBLIC_URL}

# 32 characters
spring.security.secretKey=${JWT_SECRET}
